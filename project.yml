# Projet Xcode généré par XcodeGen (`xcodegen generate`). Le fichier .xcodeproj n'est pas versionné.
name: Nooty
options:
  bundleIdPrefix: io.github.nooty
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: fr
packages:
  NootyCore:
    path: Packages/NootyCore
  Shine:
    path: Packages/Shine
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Signale toutes les erreurs de compilation, pas seulement celles du premier fichier en échec.
    OTHER_SWIFT_FLAGS: "$(inherited) -continue-building-after-errors"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "3"
targets:
  Nooty:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: NootyCore
      - package: Shine
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Nooty
        CFBundleDevelopmentRegion: fr
        CFBundleLocalizations: [fr]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: "Nooty enregistre l’audio du cours pendant que vous prenez des notes. L’enregistrement reste sur l’iPad."
        NSSpeechRecognitionUsageDescription: "Nooty transcrit l’enregistrement en texte pendant le cours, sur l’iPad quand c’est possible."
        NSCameraUsageDescription: "Nooty utilise l’appareil photo pour scanner des documents et prendre des photos à insérer dans vos notes."
        NSFaceIDUsageDescription: "Nooty utilise Face ID pour ouvrir les documents verrouillés."
        NSPhotoLibraryAddUsageDescription: "Nooty enregistre dans Photos les pages que vous exportez en image." 
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.nooty.notes
        TARGETED_DEVICE_FAMILY: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  NootyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
    dependencies:
      - target: Nooty
      - package: NootyCore
      - package: Shine
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.nooty.notes.tests
        TARGETED_DEVICE_FAMILY: "2"
  NootyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Nooty
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.nooty.notes.uitests
        TARGETED_DEVICE_FAMILY: "2"
schemes:
  NootyUITests:
    build:
      targets:
        Nooty: all
        NootyUITests: [test]
    test:
      targets:
        - NootyUITests
  Nooty:
    build:
      targets:
        Nooty: all
        NootyTests: [test]
    test:
      targets:
        - NootyTests
