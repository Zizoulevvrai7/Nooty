# Projet Xcode généré par XcodeGen (`xcodegen generate`). Le fichier .xcodeproj n'est pas versionné.
name: Nooty
options:
  bundleIdPrefix: io.github.nooty
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: fr
packages:
  NootyCore:
    path: Packages/NootyCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Nooty:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: NootyCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Nooty
        CFBundleDevelopmentRegion: fr
        CFBundleLocalizations: [fr]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.nooty.notes
        TARGETED_DEVICE_FAMILY: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  NootyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
    dependencies:
      - target: Nooty
      - package: NootyCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.nooty.notes.tests
        TARGETED_DEVICE_FAMILY: "2"
schemes:
  Nooty:
    build:
      targets:
        Nooty: all
        NootyTests: [test]
    test:
      targets:
        - NootyTests
