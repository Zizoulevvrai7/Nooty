name: iOS

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Mac Intel : les Mac ARM gratuits sont souvent saturés.
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Versions des outils
        run: |
          xcodebuild -version
          swift --version

      - name: Tests du cœur (NootyCore)
        run: swift test --package-path Packages/NootyCore

      - name: Génération du projet Xcode
        run: |
          brew install xcodegen
          xcodegen --version
          xcodegen generate

      - name: Tests de l'application (simulateur iPad)
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ids = [d["udid"] for runtime, items in sorted(devices.items()) if "iOS" in runtime for d in items if d["name"].startswith("iPad")]
          print(ids[-1])
          ')
          echo "Simulateur : $UDID"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          set -o pipefail
          xcodebuild test -project Nooty.xcodeproj -scheme Nooty -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log \
            | grep -E "error:|Test Case .*(passed|failed)|Executed [0-9]+ test|\*\* TEST"

      - name: Compilation de l'IPA non signée
        run: |
          xcodebuild -project Nooty.xcodeproj -scheme Nooty -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" -quiet build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Nooty.app Payload/
          zip -qry Nooty.ipa Payload
          ls -lh Nooty.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Nooty-ipa
          path: Nooty.ipa
          retention-days: 30

      # Contrôle visuel : captures des écrans principaux, publiées dans le journal.
      # Ne bloque jamais la production de l'IPA.
      - name: Captures d'écran (simulateur iPad)
        continue-on-error: true
        timeout-minutes: 15
        run: |
          xcodebuild test -project Nooty.xcodeproj -scheme NootyUITests -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | grep -E "error:|Test Case .*(passed|failed)|\*\* TEST" || true
          for f in /tmp/nooty-captures/*.png; do
            [ -f "$f" ] || continue
            sips -s format jpeg -s formatOptions 40 -Z 1000 "$f" --out "${f%.png}.jpg" > /dev/null
            echo "=====CAPTURE $(basename "${f%.png}")====="
            base64 -i "${f%.png}.jpg" | fold -w 120
            echo "=====FIN====="
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Nooty-captures
          path: /tmp/nooty-captures/*.png
          if-no-files-found: ignore
          retention-days: 14
